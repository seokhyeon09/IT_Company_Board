services:
  web:
    image: odoo:18.0
    container_name: it_helpdesk_odoo
    depends_on:
      - db
      - mailpit
    # 개발/검증용 SMTP 싱크(Mailpit)로 발송한다. 실제 SMTP를 쓰려면 이 command를 제거하고 Odoo에서 발신 메일 서버를 설정한다.
    command: ["odoo", "--smtp=mailpit", "--smtp-port=1025", "--email-from=it-helpdesk-noreply@company.com"]
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?.env에 GATEWAY_SHARED_SECRET(32자 이상 무작위 값)을 설정하세요}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: it_helpdesk_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: it_helpdesk_mailpit
    environment:
      - MP_MAX_MESSAGES=500
    ports:
      - "8025:8025"   # 수신 메일 확인 화면 (http://localhost:8025), SMTP(1025)는 내부 네트워크 전용
    restart: unless-stopped

  filter:
    build:
      context: ./filter
      dockerfile: Dockerfile
    container_name: it_helpdesk_filter
    depends_on:
      - web
    ports:
      - "8000:8000"
    environment:
      - ODOO_RPC_URL=http://web:8069
      - ODOO_DB=helpdesk_db
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?.env에 GATEWAY_SHARED_SECRET(32자 이상 무작위 값)을 설정하세요}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?.env에 JWT_SECRET_KEY(32자 이상 무작위 값)을 설정하세요}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_helpdesk_frontend
    depends_on:
      - filter
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
